<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이 차는 뭘까?</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <h1>이 차는 뭘까?</h1>
    <div class="stats">
      <span>문제 <b id="round">-</b></span>
      <span>점수 <b id="score">0</b></span>
    </div>
    <ol id="progress" class="progress" aria-label="이번 판 진행도"></ol>
  </header>

  <main id="game" class="card">
    <section class="viewer">
      <div class="frame">
        <img id="clue-img" alt="자동차 부분 단서 사진">
        <span id="clue-label" class="clue-label"></span>
      </div>
      <div class="clue-bar">
        <div id="clue-tabs" class="clue-tabs"></div>
        <button id="hint-btn" class="ghost">단서 하나 더 보기 <small>-30%</small></button>
      </div>
    </section>

    <section class="answers">
      <h2>모델명</h2>
      <div id="model-choices" class="choices"></div>
      <h2>연식 (세대)</h2>
      <div id="year-choices" class="choices"></div>
      <button id="submit-btn" class="primary" disabled>정답 확인</button>
    </section>

    <section id="result" class="result" hidden>
      <p id="result-title" class="result-title"></p>
      <p class="answer-line">정답: <b id="answer-model"></b> · <b id="answer-year"></b></p>
      <figure class="reveal">
        <div class="reveal-frame">
          <img id="photo-img" alt="정답 차량 전체 사진">
          <div id="photo-boxes" class="photo-boxes"></div>
        </div>
        <figcaption>
          <div id="photo-tabs" class="photo-tabs"></div>
          <span id="photo-credit" class="photo-credit"></span>
        </figcaption>
      </figure>
      <button id="next-btn" class="primary">다음 문제</button>
    </section>
  </main>

  <main id="summary" class="card" hidden>
    <section class="summary-card">
      <p class="summary-eyebrow">10문제 결과</p>
      <h2 id="sum-rank" class="summary-rank"></h2>
      <p id="sum-comment" class="summary-comment"></p>
      <p class="summary-score"><b id="sum-score">0</b><span id="sum-max"></span></p>
      <p id="sum-marks" class="summary-marks" aria-label="문제별 결과"></p>
      <dl class="summary-stats">
        <div><dt>모델 정답</dt><dd id="sum-model"></dd></div>
        <div><dt>연식 정답</dt><dd id="sum-year"></dd></div>
        <div><dt>둘 다 정답</dt><dd id="sum-perfect"></dd></div>
        <div><dt>평균 단서</dt><dd id="sum-clues"></dd></div>
      </dl>
      <div class="summary-actions">
        <button id="copy-btn" class="ghost">결과 복사</button>
        <button id="again-btn" class="primary">다시 하기</button>
      </div>
      <p id="copy-status" class="copy-status" aria-live="polite"></p>
    </section>

    <section class="summary-rows">
      <h2>문제별 결과</h2>
      <ol id="sum-rows"></ol>
    </section>
  </main>

  <footer class="foot">
    사진: Wikimedia Commons (각 사진의 라이선스를 따름) · 문제에서는 브랜드 로고를 잘라내거나 블러 처리하고, 정답 확인 후 원본을 보여줘요
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
